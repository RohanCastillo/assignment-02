[project]
name = "assignment-02"
version = "0.1.0"
description = "Course assignment on robustness testing with PyTorch transforms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "numpy",
    "seaborn",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "ipykernel",
    "nbconvert>=7.17.2",
]

[tool.uv]
package = false

# Amarel's GPU nodes have a CUDA 12.8 driver, which can't run the default
# CUDA 13.x builds of PyTorch. Install the CUDA 12.6 builds instead (they
# also run on CPU-only machines).
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
